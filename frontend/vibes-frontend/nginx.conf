server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Rota ESPECÍFICA para Autenticação (PREFERÊNCIA MÁXIMA)
    # Qualquer coisa que comece por /api/auth/ vai para o auth-service.
    location /api/auth/ {
        proxy_pass http://auth-service:8000; 
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # 2. Rota GERAL da API (CATCH-ALL da API)
    # Qualquer outra coisa em /api/ (users, chats) vai para o chat-service.
    location /api/ {
        proxy_pass http://chat-service:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
    
    # 3. Serve a aplicação React
    location / {
        try_files $uri $uri/ /index.html;
    }
}