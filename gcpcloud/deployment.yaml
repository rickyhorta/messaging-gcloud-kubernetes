# ------------------------------------------------------------------------------
# AUTH DATABASE
# ------------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-init-sql
data:
  init.sql: |
    {{ lookup('file', '/home/database/auth-init.sql') | indent(4) }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: auth-db-pv
spec:
  capacity:
    storage: 2Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data/auth-db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-db-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: manual
  volumeName: auth-db-pv
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-db-deployment
  labels:
    app: auth-db
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO volume: old pod must release it before the new mounts
  selector:
    matchLabels:
      app: auth-db
  template:
    metadata:
      labels:
        app: auth-db
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker1   # keep the pod next to its hostPath data
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_USER
          value: "{{ postgres_user }}"
        - name: POSTGRES_PASSWORD
          value: "{{ postgres_password }}"
        - name: POSTGRES_DB
          value: "{{ auth_db_name | default('authdb') }}"
        - name: PGDATA   # subPath keeps initdb happy on a non-empty mount root
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "{{ postgres_user }}", "-d", "{{ auth_db_name | default('authdb') }}"]
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: init-sql
        configMap:
          name: auth-init-sql
      - name: data
        persistentVolumeClaim:
          claimName: auth-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: auth-db
spec:
  selector:
    app: auth-db
  ports:
    - port: 5432
      targetPort: 5432
---
