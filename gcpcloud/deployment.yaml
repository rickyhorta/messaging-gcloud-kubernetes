# ------------------------------------------------------------------------------
# Auth Service
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      annotations:   # picked up by Prometheus pod discovery
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
      - name: auth-service
        image: docker.io/{{ docker_user }}/auth-service:{{ image_tag | default('latest') }}
        imagePullPolicy: Always
        env:
        - name: DATABASE_URL
          value: "postgresql://{{ postgres_user }}:{{ postgres_password }}@auth-db:5432/{{ auth_db_name | default('authdb') }}"
        - name: JWT_SECRET
          value: "{{ jwt_secret }}"
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
---
# ------------------------------------------------------------------------------
# Chat Service
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-deployment
  labels:
    app: chat-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: chat-service
          image: docker.io/{{ docker_user }}/chat-service:{{ image_tag | default('latest') }}
          imagePullPolicy: Always
          env:
          - name: DATABASE_URL
            value: "postgresql://{{ postgres_user }}:{{ postgres_password }}@chat-db:5432/{{ chat_db_name | default('chatdb') }}"
          - name: JWT_SECRET
            value: "{{ jwt_secret }}"
          - name: AUTH_SERVICE_URL
            value: "http://auth-service:8000"
          ports:
          - containerPort: 8001
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /docs
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
spec:
  selector:
    app: chat-service
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
---
# ------------------------------------------------------------------------------
# Frontend
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: docker.io/{{ docker_user }}/vibes-frontend:{{ image_tag | default('latest') }}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
